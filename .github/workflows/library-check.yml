name: Library check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  library-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bunx @defold-typescript/cli@latest library check --data .
